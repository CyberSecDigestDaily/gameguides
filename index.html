<style>
/* ====================================================================
   BLOOD GUIDES — Codex design system
   Palette: Sanzo Wada · A Dictionary of Color Combinations, Vol. 2
   Pigments — bengara · kihada · bishamon · konjō · tonoko · shiracha
   ==================================================================== */
:root {
  --bengara:    #B0492A;
  --bengara-2:  #8E3A1F;
  --bengara-3:  #F0DCD0;
  --kihada:     #D9A22F;
  --kihada-3:   #F4E5C2;
  --bishamon:   #1F6F73;
  --bishamon-3: #CCE0DE;
  --konjo:      #1E4E78;
  --konjo-3:    #CFDAE6;
  --tonoko:     #A8966E;
  --suo:        #8E3A4A;
  --sumi:       #2B2520;
  --shiracha:   #EDE7DE;

  --ink:        var(--sumi);
  --paper:      var(--shiracha);
  --bg:         var(--paper);
  --bg-soft:    #E2D9CA;
  --surface:    #F6F1E7;
  --surface-2:  #E5DDCC;
  --surface-3:  #D4C8B1;
  --line:       #C9BCA1;
  --line-soft:  #DDD0B6;

  --ink-2:      #4A3F35;
  --ink-3:      #6F6253;
  --ink-4:      #94876F;

  --accent:     var(--bengara);
  --accent-2:   var(--bengara-2);
  --accent-soft:var(--bengara-3);
  --accent-ink: #F6F1E7;

  --positive:   var(--bishamon);
  --warn:       var(--kihada);
  --critical:   var(--bengara);
  --info:       var(--konjo);
  --positive-soft: var(--bishamon-3);
  --warn-soft:     var(--kihada-3);
  --info-soft:     var(--konjo-3);

  --radius-xs: 4px;
  --radius-sm: 8px;
  --radius:    12px;
  --radius-lg: 16px;
  --radius-xl: 22px;

  --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.04);
  --shadow:    0 4px 14px oklch(0 0 0 / 0.06);
  --shadow-lg: 0 20px 50px -16px oklch(0 0 0 / 0.12);

  --font-display: 'Instrument Serif', 'EB Garamond', Georgia, serif;
  --font: 'DM Sans', system-ui, -apple-system, "Helvetica Neue", sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;

  --content-pad: 32px;
  --gap-card: 14px;
}

[data-theme="dark"] {
  --bengara:    #C75A38;
  --bengara-2:  #A04425;
  --bengara-3:  #3A1F18;
  --kihada:     #E3B14A;
  --kihada-3:   #3A2E16;
  --bishamon:   #38938F;
  --bishamon-3: #163230;
  --konjo:      #4374A6;
  --konjo-3:    #14253A;
  --tonoko:     #B0986A;
  --suo:        #B0526A;
  --sumi:       #15110D;
  --shiracha:   #E8DDC9;

  --ink:        var(--shiracha);
  --paper:      var(--sumi);
  --bg:         var(--paper);
  --bg-soft:    #100D0A;
  --surface:    #221D17;
  --surface-2:  #2C2620;
  --surface-3:  #3A332B;
  --line:       #3A3128;
  --line-soft:  #2E2820;

  --ink-2:      #C5B89F;
  --ink-3:      #998C75;
  --ink-4:      #6F6553;

  --accent:     var(--bengara);
  --accent-2:   var(--bengara-2);
  --accent-soft:var(--bengara-3);
  --accent-ink: #FBF4E6;

  --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
  --shadow:    0 4px 14px rgba(0,0,0,0.45);
  --shadow-lg: 0 20px 50px -16px rgba(0,0,0,0.6);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  min-height: 100vh;
  overflow-x: hidden;
  font-feature-settings: "ss01","cv01","cv02";
}
button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; padding: 0; }
input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }
h1,h2,h3,h4,h5 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
.display { font-family: var(--font-display); font-weight: 400; letter-spacing: -0.005em; }
p { margin: 0; }
ul { margin: 0; padding: 0; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: var(--ink-4); }

/* Bookplate */
.bookplate { position: absolute; inset: 0; }
.bookplate svg { width: 100%; height: 100%; display: block; }

/* App shell */
.app {
  display: grid;
  grid-template-columns: 240px minmax(0,1fr);
  min-height: 100vh;
  background: var(--bg);
}

/* Sidebar */
.sidebar {
  border-right: 1px solid var(--line-soft);
  background: var(--bg-soft);
  padding: 24px 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 24px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 8px 18px;
  border-bottom: 1px solid var(--line-soft);
}
.brand-mark {
  width: 36px; height: 36px;
  border-radius: 8px;
  background: var(--ink);
  color: var(--bg);
  display: grid; place-items: center;
  font-family: var(--font-display);
  font-weight: 400;
  font-style: italic;
  font-size: 20px;
  letter-spacing: -0.04em;
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
}
.brand-mark::before {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(135deg, transparent 40%, var(--accent) 100%);
  opacity: 0.5;
}
.brand-mark span { position: relative; z-index: 1; }
.brand-name { display: flex; flex-direction: column; line-height: 1; }
.brand-name .nm { font-family: var(--font-display); font-weight: 400; font-size: 19px; letter-spacing: -0.005em; line-height: 1.1; white-space: nowrap; }
.brand-name .nm em { font-style: italic; color: var(--accent); }
.brand-name .sub { font-size: 10px; color: var(--ink-3); margin-top: 5px; letter-spacing: 0.06em; font-weight: 500; text-transform: uppercase; }
.nav-label { font-size: 10.5px; letter-spacing: 0.08em; color: var(--ink-4); text-transform: uppercase; margin: 4px 10px 8px; font-weight: 600; }
.nav { display: flex; flex-direction: column; gap: 1px; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 10px;
  border-radius: 8px;
  color: var(--ink-2);
  font-size: 13.5px;
  font-weight: 500;
  transition: background 120ms, color 120ms;
  text-align: left;
  width: 100%;
}
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
[data-theme="dark"] .nav-item.active { background: var(--surface-2); }
.nav-item .ic { width: 16px; height: 16px; opacity: 0.85; flex-shrink: 0; color: currentColor; }
.nav-item.active .ic { color: var(--accent); opacity: 1; }
.nav-item .badge { margin-left: auto; font-size: 10.5px; font-family: var(--font-mono); color: var(--ink-3); background: var(--surface-2); padding: 2px 6px; border-radius: 999px; font-weight: 500; }
[data-theme="dark"] .nav-item .badge { background: var(--surface-3); }
.nav-item.active .badge { color: var(--accent); background: var(--accent-soft); }
.game-list { display: flex; flex-direction: column; gap: 2px; }
.game-pill {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px;
  border-radius: 8px;
  text-align: left; width: 100%;
  cursor: pointer;
  transition: background 120ms;
}
.game-pill:hover { background: var(--surface-2); }
.game-pill.active { background: var(--surface); box-shadow: var(--shadow-sm); }
[data-theme="dark"] .game-pill.active { background: var(--surface-2); }
.game-glyph { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; font-weight: 700; font-size: 10px; letter-spacing: 0; flex-shrink: 0; color: #fff; }
.game-info { flex: 1; min-width: 0; }
.game-name { font-size: 12.5px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.game-tag { font-size: 10.5px; color: var(--ink-4); margin-top: 1px; }
.game-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: 0; }
.game-pill.active .game-dot { opacity: 1; }
.sidebar-foot { margin-top: auto; padding: 14px; background: var(--surface); border: 1px solid var(--line-soft); border-radius: 12px; }
.sidebar-foot .label { font-size: 10px; letter-spacing: 0.08em; color: var(--ink-4); text-transform: uppercase; font-weight: 600; }
.sidebar-foot .value { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin: 4px 0 8px; }
.sidebar-foot .prog { height: 4px; background: var(--surface-3); border-radius: 2px; overflow: hidden; }
.sidebar-foot .prog i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.sidebar-foot .meta { font-size: 11px; color: var(--ink-3); margin-top: 8px; display: flex; justify-content: space-between; }

/* Main area */
.main {
  padding: 20px var(--content-pad) 80px;
  display: flex;
  flex-direction: column;
  gap: 28px;
  min-width: 0;
}

/* Topbar */
.topbar { display: flex; align-items: center; gap: 12px; }
.search {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: 999px;
  transition: border-color 120ms, background 120ms;
  cursor: pointer;
}
.search:focus-within { border-color: var(--ink-4); }
.search input { flex: 1; background: none; border: none; outline: none; font-size: 13.5px; color: var(--ink); }
.search input::placeholder { color: var(--ink-4); }
.search .kbd { font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); background: var(--surface-2); border: 1px solid var(--line-soft); padding: 2px 6px; border-radius: 4px; }
.icon-btn {
  width: 38px; height: 38px;
  display: grid; place-items: center;
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: 999px;
  color: var(--ink-2);
  transition: background 120ms, color 120ms;
  position: relative;
  flex-shrink: 0;
}
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn .dot { position: absolute; top: 8px; right: 9px; width: 7px; height: 7px; background: var(--accent); border-radius: 50%; border: 1.5px solid var(--surface); }
.user-pill { display: flex; align-items: center; gap: 10px; padding: 4px 12px 4px 4px; background: var(--surface); border: 1px solid var(--line-soft); border-radius: 999px; }
.user-avatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--ink)); display: grid; place-items: center; font-weight: 700; font-size: 11px; color: #fff; }
.user-name { font-size: 13px; font-weight: 600; line-height: 1.1; }
.user-rank { font-size: 10.5px; color: var(--ink-3); margin-top: 1px; }

/* Section headers */
.section-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
.section-head h2 { font-family: var(--font-display); font-size: 30px; font-weight: 400; letter-spacing: -0.01em; line-height: 1.15; margin: 0; text-wrap: balance; }
.section-head .eyebrow { font-size: 11px; letter-spacing: 0.06em; color: var(--ink-3); text-transform: uppercase; font-weight: 600; margin-bottom: 6px; }
.section-head .tools { display: flex; gap: 6px; align-items: center; }
.section-head .more { font-size: 12px; color: var(--ink-3); font-weight: 500; cursor: pointer; }
.section-head .more:hover { color: var(--accent); }
.chip { font-size: 12px; font-weight: 500; padding: 6px 12px; border-radius: 999px; background: transparent; color: var(--ink-3); cursor: pointer; transition: all 120ms; border: 1px solid transparent; }
.chip:hover { color: var(--ink); background: var(--surface-2); }
.chip.active { color: var(--ink); background: var(--surface); border-color: var(--line-soft); box-shadow: var(--shadow-sm); }
[data-theme="dark"] .chip.active { background: var(--surface-3); }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; transition: transform 120ms, background 120ms, box-shadow 120ms; }
.btn-primary { background: var(--ink); color: var(--bg); }
.btn-primary:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.btn-accent { background: var(--accent); color: var(--accent-ink); }
.btn-accent:hover { transform: translateY(-1px); background: var(--accent-2); }
.btn-ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line-soft); }
.btn-ghost:hover { background: var(--surface-2); }
.btn-sm { padding: 7px 12px; font-size: 12px; }

/* Hero */
.hero {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  border-radius: var(--radius-xl);
  overflow: hidden;
  background: var(--surface);
  border: 1px solid var(--line-soft);
  box-shadow: var(--shadow);
  min-height: 420px;
}
.hero-body { padding: 44px 44px 38px; display: flex; flex-direction: column; gap: 18px; justify-content: center; }
.hero-visual { position: relative; overflow: hidden; background: var(--surface-2); }
.hero-visual::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(135deg, transparent 0%, rgba(43,37,32,0.18) 100%);
  mix-blend-mode: multiply;
}
[data-theme="dark"] .hero-visual::after { background: linear-gradient(135deg, transparent 0%, rgba(15,13,10,0.35) 100%); mix-blend-mode: normal; }
.hero-visual .floating-badge {
  position: absolute;
  background: rgba(43,37,32,0.72);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(237,231,222,0.15);
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 12px;
  z-index: 2;
  color: #EDE7DE;
}
.hero-visual .floating-badge .l { font-size: 10px; color: rgba(237,231,222,0.65); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; }
.hero-visual .floating-badge .v { font-weight: 600; font-family: var(--font-mono); font-size: 13px; margin-top: 3px; }
.hero-visual .floating-badge.bg-top { top: 28px; left: 28px; }
.hero-visual .floating-badge.bg-bot { bottom: 28px; right: 28px; }
.hero-visual-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 22px 28px; z-index: 2; color: #EDE7DE; background: linear-gradient(180deg, transparent, rgba(15,13,10,0.78)); }
.hero-visual-overlay .credit { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.7; }
.hero-visual-overlay .title { font-family: var(--font-display); font-style: italic; font-size: 18px; margin-top: 6px; }
.hero-eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); font-weight: 600; width: max-content; }
.hero-eyebrow .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); position: relative; }
.hero-eyebrow .pulse::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 1.5px solid var(--accent); opacity: 0.3; animation: pulse 1.6s ease-out infinite; }
@keyframes pulse { 0% { transform: scale(0.5); opacity: 0.5; } 100% { transform: scale(2); opacity: 0; } }
.hero-title { font-family: var(--font-display); font-size: 64px; font-weight: 400; line-height: 0.98; letter-spacing: -0.015em; margin: 0; }
.hero-title em { font-style: italic; color: var(--accent); font-weight: 400; }
.hero-desc { font-size: 14px; color: var(--ink-3); max-width: 480px; line-height: 1.6; }
.hero-meta { display: flex; gap: 24px; font-size: 12px; color: var(--ink-3); }
.hero-meta strong { color: var(--ink); font-weight: 600; font-family: var(--font-mono); font-size: 13px; display: block; margin-bottom: 2px; }
.hero-meta div .l { font-size: 10px; color: var(--ink-4); letter-spacing: 0.06em; text-transform: uppercase; }
.hero-cta { display: flex; gap: 10px; margin-top: 12px; }

/* Stat tiles */
.stat-row { display: grid; grid-template-columns: repeat(4,1fr); gap: var(--gap-card); }
.stat-tile { padding: 18px 20px; background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius); display: flex; flex-direction: column; gap: 4px; cursor: pointer; transition: transform 120ms, box-shadow 120ms; }
.stat-tile:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.stat-tile .label { font-size: 11.5px; color: var(--ink-3); font-weight: 500; }
.stat-tile .value { font-size: 28px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.1; margin-top: 4px; font-family: var(--font); }
.stat-tile .change { font-size: 11px; color: var(--ink-4); margin-top: 6px; display: flex; align-items: center; gap: 6px; }
.stat-tile .change .pip { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

/* Build cards */
.cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); gap: var(--gap-card); }
.build-card { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius); overflow: hidden; transition: transform 150ms, box-shadow 150ms, border-color 150ms; cursor: pointer; display: flex; flex-direction: column; text-decoration: none; color: inherit; }
.build-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: var(--line); }
.build-art { height: 160px; position: relative; background: var(--surface-3); overflow: hidden; display: grid; place-items: center; }
.build-art::after { content: none; }
.build-art .tier { position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; display: grid; place-items: center; background: rgba(43,37,32,0.78); color: #EDE7DE; font-weight: 700; font-size: 12px; border-radius: 999px; z-index: 2; backdrop-filter: blur(8px); font-family: var(--font); }
.build-art .tier[data-t="S"] { background: var(--accent); color: var(--accent-ink); }
.build-art .game-tag { position: absolute; bottom: 10px; left: 10px; font-size: 10.5px; letter-spacing: 0.04em; font-weight: 500; color: #EDE7DE; background: rgba(43,37,32,0.62); backdrop-filter: blur(8px); padding: 4px 10px; border-radius: 999px; z-index: 2; }
.build-body { padding: 14px 16px 16px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
.build-meta { font-size: 10.5px; color: var(--ink-4); letter-spacing: 0.04em; font-weight: 600; text-transform: uppercase; }
.build-title { font-family: var(--font-display); font-size: 22px; font-weight: 400; letter-spacing: -0.005em; line-height: 1.15; }
.build-sub { font-size: 12px; color: var(--ink-3); }
.build-stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; margin-top: 10px; }
.build-stats .col { display: flex; flex-direction: column; gap: 4px; }
.build-stats .col .l { font-size: 9.5px; color: var(--ink-4); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; }
.build-stats .col .bar { height: 3px; background: var(--surface-3); border-radius: 2px; overflow: hidden; }
.build-stats .col .bar i { display: block; height: 100%; background: var(--ink); border-radius: 2px; }
.build-stats .col .bar i.hi { background: var(--accent); }
.build-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
.build-tag { font-size: 10.5px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-3); border: 1px solid var(--line-soft); }
.build-foot { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line-soft); font-size: 11.5px; color: var(--ink-3); }
.build-foot .reads { font-family: var(--font-mono); }
.bookmark-btn { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 6px; color: var(--ink-4); transition: color 120ms, background 120ms; }
.bookmark-btn:hover { color: var(--accent); background: var(--surface-2); }
.bookmark-btn.on { color: var(--accent); }

/* News + Trending */
.news-trend { display: grid; grid-template-columns: minmax(0,1.45fr) minmax(0,1fr); gap: 14px; align-items: stretch; }
.news-card { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius); overflow: hidden; cursor: pointer; transition: transform 150ms, box-shadow 150ms; display: flex; flex-direction: column; }
.news-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.news-list { display: flex; flex-direction: column; gap: 0; }
.news-item { display: flex; flex-direction: column; gap: 4px; padding: 13px 18px; border-bottom: 1px solid var(--line-soft); cursor: pointer; transition: background 120ms; text-decoration: none; color: inherit; }
.news-item:last-child { border-bottom: none; }
.news-item:hover { background: var(--surface-2); }
.news-item-head { display: flex; align-items: center; gap: 8px; font-size: 10.5px; color: var(--ink-4); }
.news-item-title { font-size: 12.5px; color: var(--ink-2); line-height: 1.45; }
.patch-tag { font-family: var(--font-mono); font-size: 9px; padding: 1px 6px; border-radius: 999px; font-weight: 600; letter-spacing: 0.04em; }
.patch-tag[data-t="NERF"] { background: var(--bengara-3); color: var(--critical); }
.patch-tag[data-t="BUFF"] { background: var(--positive-soft); color: var(--positive); }
.patch-tag[data-t="NEW"]  { background: var(--warn-soft); color: var(--kihada); }
.patch-tag[data-t="FIX"]  { background: var(--info-soft); color: var(--info); }
[data-theme="dark"] .patch-tag[data-t="NEW"] { color: var(--warn); }

/* Trending panel */
.trend-panel { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 22px 22px 12px; display: flex; flex-direction: column; position: relative; overflow: hidden; }
.trend-panel::before { content: ""; position: absolute; top: 0; bottom: 0; right: 0; width: 8px; background: linear-gradient(180deg, var(--bengara) 0%, var(--bengara) 28%, var(--kihada) 28%, var(--kihada) 56%, var(--bishamon) 56%, var(--bishamon) 78%, var(--konjo) 78%); }
.trend-panel-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; padding-right: 14px; }
.trend-panel-head .eyebrow { font-family: var(--font-display); font-style: italic; font-size: 18px; letter-spacing: -0.005em; color: var(--ink); white-space: nowrap; }
.trend-panel-head .more { font-size: 11px; color: var(--ink-3); font-family: var(--font-mono); letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; }
.trend-panel-head .more:hover { color: var(--accent); }
.trend-list { list-style: none; margin: 0; padding: 0; flex: 1; padding-right: 14px; }
.trend-item { display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: start; padding: 12px 0; border-bottom: 1px dashed var(--line-soft); cursor: pointer; }
.trend-item:last-child { border-bottom: none; }
.trend-item:hover .t-title { color: var(--accent); }
.trend-item .rank { font-family: var(--font-display); font-style: italic; font-size: 22px; color: var(--bengara); line-height: 1; font-weight: 400; }
.trend-item .t-title { font-size: 13px; line-height: 1.4; font-weight: 600; transition: color 120ms; margin: 0; }
.trend-item .t-meta { font-size: 10.5px; color: var(--ink-4); margin-top: 4px; font-family: var(--font-mono); letter-spacing: 0.02em; }

/* About grid */
.about-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); gap: var(--gap-card); }
.about-card { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 22px; }
.about-card h3 { font-family: var(--font-display); font-size: 20px; font-weight: 400; letter-spacing: -0.005em; margin-bottom: 10px; line-height: 1.2; }
.about-card p { font-size: 13px; color: var(--ink-3); line-height: 1.65; }

/* Coming soon */
.coming-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap: var(--gap-card); }
.coming-card { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.coming-card .game-label { font-size: 10.5px; color: var(--accent); letter-spacing: 0.04em; font-weight: 600; text-transform: uppercase; }
.coming-card .guide-name { font-family: var(--font-display); font-size: 17px; font-weight: 400; letter-spacing: -0.005em; line-height: 1.25; }
.coming-badge { display: inline-block; font-size: 9.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-top: 4px; width: max-content; font-family: var(--font-mono); }
.coming-badge.planned { background: var(--info-soft); color: var(--info); }

/* Search overlay */
.search-overlay { position: fixed; inset: 0; background: rgba(15,13,10,0.55); z-index: 1000; display: grid; place-items: start center; padding-top: 120px; backdrop-filter: blur(6px); animation: fadeIn 160ms ease-out; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.search-palette { width: min(640px, calc(100% - 32px)); background: var(--surface); border-radius: 14px; border: 1px solid var(--line); box-shadow: var(--shadow-lg); overflow: hidden; display: flex; flex-direction: column; max-height: 520px; animation: slideDown 200ms ease-out; }
@keyframes slideDown { from { transform: translateY(-12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.search-palette-input { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line-soft); }
.search-palette-input input { flex: 1; background: none; border: none; outline: none; font-size: 15px; color: var(--ink); }
.search-palette-input input::placeholder { color: var(--ink-4); }
.search-palette-results { overflow-y: auto; padding: 6px; }
.search-result { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-size: 13.5px; }
.search-result:hover, .search-result.active { background: var(--surface-2); }
.search-result .ic2 { width: 28px; height: 28px; border-radius: 7px; background: var(--surface-2); display: grid; place-items: center; color: var(--ink-3); flex-shrink: 0; }
.search-result.active .ic2 { background: var(--accent-soft); color: var(--accent); }
.search-result .nm { font-weight: 600; }
.search-result .t { font-size: 11px; color: var(--ink-4); margin-top: 1px; }
.search-result .arrow { margin-left: auto; opacity: 0; color: var(--ink-4); }
.search-result.active .arrow { opacity: 1; }
.search-palette-foot { padding: 10px 16px; border-top: 1px solid var(--line-soft); font-size: 11px; color: var(--ink-4); display: flex; gap: 16px; }
.search-palette-foot .kbd2 { font-family: var(--font-mono); background: var(--surface-2); border: 1px solid var(--line-soft); padding: 1px 5px; border-radius: 4px; margin-right: 4px; }
.search-empty { padding: 28px 20px; text-align: center; color: var(--ink-4); font-size: 13px; }

/* Divider */
.divider { height: 1px; background: var(--line-soft); margin: 8px 0; }

/* Responsive */
@media (max-width: 1340px) {
  .app { grid-template-columns: 232px minmax(0,1fr); }
  .hero { grid-template-columns: 1fr; }
  .hero-visual { min-height: 280px; }
  .news-trend { grid-template-columns: 1fr; }
}
@media (max-width: 920px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .main { padding: 16px 18px 60px; }
  .stat-row { grid-template-columns: repeat(2,1fr); }
  .hero-title { font-size: 30px; }
}

      <path d="M30 44 L50 10 L70 44 Z" opacity="0.7"/>
      <path d="M26 56 L74 56 L78 96 L22 96 Z" opacity="0.4"/>
      <rect x="42" y="56" width="16" height="16" opacity="0.8"/>
    </g>
  ),
};

function bpHash(s) {
  let h = 2166136261;
  for (let i = 0; i < String(s).length; i++) {
    h ^= String(s).charCodeAt(i);
    h = (h * 16777619) >>> 0;
  }
  return h;
}

const BP_ALIAS = {
  "Elden Ring":"elden-ring","Diablo 4":"diablo-4","Baldur's Gate 3":"bg3",
  "Space Marine 2":"spacemarine2","40K: Darktide":"darktide",
  "Fallout 76":"fallout76","Fallout 4":"fallout4",
};
function resolveGameId(id) {
  if (!id) return "elden-ring";
  return BP_ALIAS[id] || id;
}
const cssVar = (n) => `var(--${n})`;

function LayoutA({ field, ink, accent, motif, paperColor }) {
  return (
    <svg viewBox="0 0 100 100" preserveAspectRatio="none">
      <rect width="100" height="100" fill={paperColor} />
      <rect x="0" y="0" width="78" height="74" fill={field} />
      <g transform="translate(8 6) scale(0.62)" color={ink}>{motif}</g>
      <rect x="78" y="0" width="22" height="100" fill={accent} />
      <rect x="0" y="74" width="38" height="26" fill={ink} />
      <rect x="38" y="74" width="40" height="26" fill={paperColor} />
    </svg>
  );
}
function LayoutB({ field, ink, accent, motif, paperColor }) {
  return (
    <svg viewBox="0 0 100 100" preserveAspectRatio="none">
      <rect width="100" height="100" fill={paperColor} />
      <rect x="0" y="6" width="68" height="88" fill={field} />
      <g transform="translate(2 8) scale(0.64)" color={ink}>{motif}</g>
      <rect x="74" y="14" width="14" height="36" fill={accent} />
      <rect x="74" y="56" width="20" height="32" fill={ink} />
    </svg>
  );
}
function LayoutC({ field, ink, accent, motif, paperColor }) {
  return (
    <svg viewBox="0 0 100 100" preserveAspectRatio="none">
      <rect width="100" height="100" fill={field} />
      <rect x="0" y="0" width="100" height="10" fill={ink} />
      <g transform="translate(8 10) scale(0.66)" color={ink}>{motif}</g>
      <rect x="72" y="72" width="28" height="28" fill={accent} />
      <rect x="72" y="72" width="28" height="6" fill={ink} />
    </svg>
  );
}
const BP_LAYOUTS = [LayoutA, LayoutB, LayoutC];

function Bookplate({ gameId, seed }) {
  const g = resolveGameId(gameId);
  const palNames = BP_PALETTES[g] || BP_FALLBACK;
  const motif = Motifs[g] || Motifs["elden-ring"];
  const idx = bpHash(seed || g) % BP_LAYOUTS.length;
  const Layout = BP_LAYOUTS[idx];
  const rot = bpHash((seed || "") + "r") % 3;
  const ordered = [palNames[rot % 3], palNames[(rot + 1) % 3], palNames[(rot + 2) % 3]];
  return (
    <div style={{ position:"absolute", inset:0, overflow:"hidden" }} aria-hidden="true">
      <Layout
        field={cssVar(ordered[0])}
        ink={cssVar(ordered[1])}
        accent={cssVar(ordered[2])}
        paperColor="var(--shiracha)"
        motif={motif}
      />
    </div>
  );
}

// ============================================================
function SearchPalette({ open, onClose }) {
  const inputRef = useRef(null);
  const [q, setQ] = useState("");
  const [active, setActive] = useState(0);

  useEffect(() => {
    if (open) { setQ(""); setActive(0); setTimeout(() => inputRef.current && inputRef.current.focus(), 30); }
  }, [open]);

  const items = useMemo(() => {
    const all = BUILDS.map(b => ({ kind:"Build", label:b.title, tag:b.game, url:b.url }));
    const query = q.toLowerCase().trim();
    if (!query) return all;
    return all.filter(i => i.label.toLowerCase().includes(query) || i.tag.toLowerCase().includes(query));
  }, [q]);

  useEffect(() => { setActive(0); }, [q]);

  useEffect(() => {
    if (!open) return;
    const fn = e => {
      if (e.key === "Escape") { onClose(); }
      else if (e.key === "ArrowDown") { e.preventDefault(); setActive(a => Math.min(a+1, items.length-1)); }
      else if (e.key === "ArrowUp") { e.preventDefault(); setActive(a => Math.max(a-1, 0)); }
      else if (e.key === "Enter") {
        const r = items[active];
        if (r) { window.location.href = r.url; onClose(); }
      }
    };
    window.addEventListener("keydown", fn);
    return () => window.removeEventListener("keydown", fn);
  }, [open, items, active, onClose]);

  if (!open) return null;
  return (
    <div className="search-overlay" onClick={onClose}>
      <div className="search-palette" onClick={e => e.stopPropagation()}>
        <div className="search-palette-input">
          {Icons.search}
          <input ref={inputRef} value={q} onChange={e => setQ(e.target.value)} placeholder="Search builds, games…"/>
        </div>
        <div className="search-palette-results">
          {items.length === 0 && <div className="search-empty">No results for "{q}"</div>}
          {items.map((r,i) => (
            <a key={i} href={r.url}
              className={"search-result" + (i === active ? " active" : "")}
              onMouseEnter={() => setActive(i)}>
              <div className="ic2">{Icons.builds}</div>
              <div style={{minWidth:0}}>
                <div className="nm">{r.label}</div>
                <div className="t">{r.kind} · {r.tag}</div>
              </div>
              <span className="arrow">{Icons.arrow}</span>
            </a>
          ))}
        </div>
        <div className="search-palette-foot">
          <span><span className="kbd2">↑↓</span>navigate</span>
          <span><span className="kbd2">↵</span>open</span>
          <span><span className="kbd2">esc</span>close</span>
        </div>
      </div>
    </div>
  );
}

            <a key={label} href={url} style={{display:"block",fontSize:12.5,color:"var(--ink-3)",padding:"3px 0"}}>{label}</a>
          ))}
        </div>
      </div>
      <div style={{paddingTop:16,borderTop:"1px solid var(--line-soft)",fontSize:11,color:"var(--ink-4)",display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
        <span>© 2026 Blood Guides</span>
        <span style={{fontFamily:"var(--font-mono)",fontSize:10,letterSpacing:"0.06em"}}>BENGARA · KIHADA · BISHAMON · KONJŌ</span>
      </div>
    </footer>
  );
}

// ============================================================
//  APP
// ============================================================
function App() {
  const [theme, setTheme] = useState("light");
  const [activeSection, setSection] = useState("home");
  const [activeGame, setGame] = useState("elden-ring");
  const [filterGame, setFilterGame] = useState("all");
  const [searchOpen, setSearchOpen] = useState(false);
  const [bookmarks, setBookmarks] = useState(["samurai-bleed","rivers-of-blood"]);

  useEffect(() => {
    document.documentElement.dataset.theme = theme;
    applyPalette("showa-cover", theme);
  }, [theme]);

  useEffect(() => {
    const fn = e => {
      if ((e.metaKey || e.ctrlKey) && e.key === "k") { e.preventDefault(); setSearchOpen(true); }
    };
    window.addEventListener("keydown", fn);
    return () => window.removeEventListener("keydown", fn);
  }, []);

  const toggleBookmark = id => setBookmarks(b => b.includes(id) ? b.filter(x => x !== id) : [...b, id]);

  return (
    <div className="app">
      <Sidebar activeSection={activeSection} setSection={setSection} activeGame={activeGame} setGame={setGame} />
      <main className="main">
        <Topbar theme={theme} setTheme={setTheme} openSearch={() => setSearchOpen(true)} />
        <HeroSection />
        <StatRow />
        <BuildsSection filterGame={filterGame} setFilterGame={setFilterGame} bookmarks={bookmarks} toggleBookmark={toggleBookmark} />
        <PatchTrending />
        <AboutSection />
        <ComingSoonSection />
        <Footer />
      </main>
      <SearchPalette open={searchOpen} onClose={() => setSearchOpen(false)} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
